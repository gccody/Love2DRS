[package]
name = "love2drs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A LÖVE-inspired 2D game framework for Rust: as easy as love2d, batched and fast on wgpu."
license = "MIT OR Apache-2.0"
repository = "https://github.com/gccody/Love2DRS"
homepage = "https://github.com/gccody/Love2DRS"
documentation = "https://docs.rs/love2drs"
readme = "README.md"
keywords = ["gamedev", "2d", "game", "wgpu", "love2d"]
categories = ["game-engines", "graphics", "rendering"]
exclude = ["/assets", "/screenshots", "/skills", "/tools", "/.cargo", "/.claude-plugin"]

[workspace]
members = ["tools/cargo-love2drs"]
default-members = ["."]

[features]
default = ["audio", "gamepad", "png", "jpeg"]
## Sound playback via rodio (wav, ogg/vorbis, mp3, flac).
audio = ["dep:rodio", "dep:objc2-avf-audio", "dep:block2"]
## Gamepad input via gilrs. On Linux, building it needs the libudev headers
## (`libudev-dev` on Debian/Ubuntu, `systemd-devel` on Fedora). On Windows and
## macOS it also pulls in hidapi to drive PlayStation controllers directly.
gamepad = ["dep:gilrs", "dep:hidapi", "dep:objc2-game-controller", "dep:objc2-core-haptics"]
## PNG decoding for `Graphics::new_image`.
png = ["image/png"]
## JPEG decoding for `Graphics::new_image`.
jpeg = ["image/jpeg"]

[dependencies]
wgpu = "30"
# iOS 27 refuses apps built with its SDK unless they adopt the UIScene lifecycle, and no
# winit release can run under it. This is 0.30.13 plus one commit that attaches new windows
# to the connected scene. Return to crates.io once winit ships that (rust-windowing/winit#4224).
# It has to be a git dependency: Cargo ignores `[patch]` in a dependency, so a patch wouldn't
# reach games. Keep the Android entry below on the same rev, so only one winit gets built.
winit = { git = "https://github.com/molenick/winit", rev = "94d6a23c425023810a0879aa7a03abb2e4f1decc" }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
ab_glyph = "0.2"
log = "0.4"
image = { version = "0.25", default-features = false }
gilrs = { version = "0.11", optional = true }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "vorbis", "mp3", "flac"], optional = true }

# Input and rumble for PlayStation controllers, which gilrs can't rumble on
# Windows or macOS (see src/input/sony.rs). Linux doesn't need it: the kernel
# driver exposes their rumble to gilrs. `macos-shared-device` stops hidapi from
# opening pads exclusively, which would take them from other apps.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native", "macos-shared-device"], optional = true }

# NativeActivity needs no Java, so an APK can be packaged without Gradle.
[target.'cfg(target_os = "android")'.dependencies]
winit = { git = "https://github.com/molenick/winit", rev = "94d6a23c425023810a0879aa7a03abb2e4f1decc", features = ["android-native-activity"] }
android_logger = "0.15"
jni = "0.21"

# Apple's frameworks on iOS: UIKit for the keyboard's size, GameController and
# CoreHaptics for controllers, which gilrs doesn't support there, and AVFAudio for
# the audio session, which rodio and cpal leave to the app.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-game-controller = { version = "0.3", optional = true, features = ["objc2-core-haptics"] }
objc2-core-haptics = { version = "0.3", optional = true }
objc2-avf-audio = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }

# Dependencies (wgpu, image decoding, audio) are compiled with optimizations even in
# debug builds of the examples so they stay smooth while iterating.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Asset paths are relative to the package root and keep their name in the app,
# so `new_image("assets/x.png")` works on every platform.
[package.metadata.love2drs]
app_id = "com.gccody.love2drs"
assets = ["assets/mobile"]
icon = "assets/app-icon.png"

[[example]]
name = "starfall"
required-features = ["audio"]

[[example]]
name = "platformer"
required-features = ["audio"]
