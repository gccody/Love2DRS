[package]
name = "cargo-love2drs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Builds, installs and runs love2drs games on Android and iOS."
license = "MIT OR Apache-2.0"
repository = "https://github.com/gccody/Love2DRS"
keywords = ["gamedev", "android", "ios", "love2d", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "game-development"]

[dependencies]
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
